[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-forge"
version = "0.1.0"
description = "Generate alternative domains, score how much people will love them, and check availability."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Eidos AGI" }]
keywords = ["domains", "rdap", "naming", "brand", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Internet :: Name Service (DNS)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
domain-forge = "domain_forge.cli:main"
eidos-domains = "domain_forge.cli:main"

[project.urls]
Homepage = "https://github.com/eidos-agi/domain-forge"
Repository = "https://github.com/eidos-agi/domain-forge"
Issues = "https://github.com/eidos-agi/domain-forge/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
